<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Native AZ511 Traffic workflow</title><desc id="desc">Every five minutes, AZ511 data is filtered for I19 and SCZ, a visible-update ledger selects up to three incidents, and MeshMonitor sends native waypoints and Traffic messages. On-demand requests use a separate text responder.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#93a7bf"/></marker></defs>
<rect width="1100" height="510" rx="20" fill="#101b2b"/>
<g font-family="Arial, sans-serif" fill="#eff5ff"><text x="40" y="48" font-size="27" font-weight="bold">AZ511 Traffic on the mesh</text><text x="40" y="78" font-size="16" fill="#b5c5db">Native scheduled pins and text; separate on-demand replies</text></g>
<g fill="#203349" stroke="#496481" stroke-width="2"><rect x="40" y="125" width="205" height="120" rx="12"/><rect x="290" y="125" width="245" height="120" rx="12"/><rect x="580" y="125" width="235" height="120" rx="12"/><rect x="860" y="125" width="200" height="120" rx="12"/></g>
<g stroke="#93a7bf" stroke-width="3" marker-end="url(#arrow)"><path d="M245 185 H280"/><path d="M535 185 H570"/><path d="M815 185 H850"/></g>
<g font-family="Arial, sans-serif" fill="#eff5ff" font-size="18" text-anchor="middle"><text x="142" y="156" font-weight="bold">AZ511 feed</text><text x="142" y="190" font-size="16">Poll every 5 minutes</text><text x="142" y="219" font-size="14" fill="#b5c5db">API key in environment</text><text x="412" y="156" font-weight="bold">Python selection</text><text x="412" y="190" font-size="16">I19 / SCZ tagged events</text><text x="412" y="219" font-size="14" fill="#b5c5db">Type + active start + age</text><text x="697" y="156" font-weight="bold">Attempt ledger</text><text x="697" y="190" font-size="16">Up to 3 incidents / poll</text><text x="697" y="219" font-size="14" fill="#b5c5db">2 offers, at least 1 hour apart</text><text x="960" y="156" font-weight="bold">MeshMonitor</text><text x="960" y="190" font-size="16">Native waypoint</text><text x="960" y="219" font-size="16">Traffic channel text</text></g>
<rect x="40" y="280" width="1020" height="65" rx="12" fill="#302c22" stroke="#c6a653"/>
<g font-family="Arial, sans-serif" fill="#f4e5b2" font-size="17"><text x="62" y="307" font-weight="bold">An attempt is not a delivery receipt.</text><text x="62" y="331" font-size="15">One repeat after at least an hour. Failed or skipped pins can still be followed by text.</text></g>
<rect x="40" y="380" width="1020" height="90" rx="12" fill="#183b38" stroke="#3d8179"/>
<g font-family="Arial, sans-serif" fill="#ddfff8"><text x="62" y="409" font-size="20" font-weight="bold">On demand: !traffic, road or area</text><text x="62" y="438" font-size="17">Spicy reception only → separate responder → up to 3 replies via Spicy (3 hops)</text><text x="62" y="459" font-size="14">Bare !traffic: Metro Phoenix. Areas: Nogales / Rio Rico / Santa Cruz. Scheduled packets inherit radio hops.</text></g>
</svg>
